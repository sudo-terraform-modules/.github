name: Feature request
description: Propose a new input, resource or behaviour for a module
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible with the module today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The inputs, outputs or resources you would add or change. Rough is fine.
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream equivalent
      description: Link to how a community module or the provider docs handle it, if relevant.
  - type: dropdown
    id: breaking
    attributes:
      label: Would this change existing behaviour?
      options:
        - "No, it is additive"
        - "Yes, it changes a default or an existing input"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
